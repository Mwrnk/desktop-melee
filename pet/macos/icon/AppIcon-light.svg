      <stop offset="0" stop-color="#F3EEE2"/>
      <stop offset="1" stop-color="#D8CFBB"/>
    </linearGradient>
    <linearGradient id="screen" x1="512" y1="240" x2="512" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6A5FD8"/>
