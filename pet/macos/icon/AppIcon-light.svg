    </linearGradient>
    <linearGradient id="gloss" x1="512" y1="240" x2="512" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#body)"/>
  <rect y="965" width="1024" height="59" fill="#000000" fill-opacity="0.06"/>
  <g transform="translate(512 512) scale(1.38) translate(-512 -512)">
