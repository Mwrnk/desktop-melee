<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Desktop Melee app icon, light appearance: a beige compact Mac whose
       body is the whole icon tile; macOS masks it to the icon shape. -->
