name: Bug report
description: A crash, a hang, wrong drawing, a menu bar problem, or other misbehaviour in Desktop Melee.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first.
        Do not ask for, link to, or attach disc images. Such issues are closed.
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you built from (`git rev-parse --short HEAD`).
      placeholder: 5c518ae
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version and Mac
      placeholder: macOS 27.0, MacBook Air M3
    validations:
      required: true
  - type: dropdown
    id: screens
    attributes:
      label: Screens
      options:
        - One screen
        - Several screens, Desktop Melee on the main one
        - Several screens, Desktop Melee on another one
    validations:
      required: true
  - type: dropdown
    id: accessibility
    attributes:
      label: Accessibility permission (exact Dock size)
      options:
        - Granted
        - Not granted
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a match from the menu bar (Fox vs CPU Fox, 4 stocks)
        2. Move the Dock to the left side of the screen
        3. The fighters fall through the floor
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Quit Desktop Melee from the menu bar, then run `MELEE_PET_LOG=desktop-melee.log pet/run-overlay.sh` from the repository, reproduce the problem and attach `desktop-melee.log`.
        Paste the last 30 lines here if the file is small; attach the whole file otherwise.
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, video, settings you changed in the menu bar.
