<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Helvetica, Arial, sans-serif">
  <title>Desktop Melee on a Mac desktop</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE5F6"/>
      <stop offset="1" stop-color="#BFCDEA"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2B2F3A"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="18" fill="#FAFAFC"/>

  <!-- the screen -->
  <rect x="40" y="40" width="880" height="440" rx="14" fill="url(#wall)" stroke="#2B2F3A" stroke-width="3"/>
  <!-- an ordinary app window underneath -->
  <rect x="96" y="120" width="280" height="190" rx="10" fill="#FFFFFF" stroke="#9AA3B5" stroke-width="2"/>
  <rect x="96" y="120" width="280" height="30" rx="10" fill="#EEF0F5"/>
  <circle cx="116" cy="135" r="6" fill="#FF5F57"/>
  <circle cx="136" cy="135" r="6" fill="#FEBC2E"/>
  <circle cx="156" cy="135" r="6" fill="#28C840"/>
  <text x="236" y="236" font-size="15" fill="#6B7385" text-anchor="middle">your apps keep working</text>
  <text x="236" y="256" font-size="15" fill="#6B7385" text-anchor="middle">(clicks pass through)</text>

  <!-- menu bar, notch and island -->
  <rect x="42" y="42" width="876" height="30" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="352" y="42" width="256" height="30" rx="10" fill="#111111"/>
  <circle cx="378" cy="57" r="5" fill="#F28C28"/><circle cx="394" cy="57" r="5" fill="#F28C28"/>
  <circle cx="410" cy="57" r="5" fill="#F28C28"/><circle cx="426" cy="57" r="5" fill="#F28C28"/>
  <text x="446" y="62" font-size="13" fill="#FFFFFF" font-weight="bold">42%</text>
  <circle cx="534" cy="57" r="5" fill="#3D7BEA"/><circle cx="550" cy="57" r="5" fill="#3D7BEA"/>
  <circle cx="566" cy="57" r="5" fill="#3D7BEA"/>
  <text x="578" y="62" font-size="13" fill="#FFFFFF" font-weight="bold">7%</text>
  <!-- menu bar icon -->
  <g transform="translate(846 47)" fill="#111111">
    <rect x="7" y="2" width="6" height="3" rx="1.5"/><rect x="1" y="7" width="6" height="3" rx="1.5"/><rect x="13" y="7" width="6" height="3" rx="1.5"/>
    <path d="M0,12 H20 V14.5 H17 L13,19 H7 L3,14.5 H0 Z"/>
  </g>

  <!-- blastzones: the screen edges -->
  <rect x="52" y="82" width="856" height="388" rx="8" fill="none" stroke="#D63A3A" stroke-width="2.5" stroke-dasharray="10 7"/>

  <!-- the Dock -->
  <rect x="250" y="418" width="460" height="52" rx="16" fill="#FFFFFF" fill-opacity="0.75" stroke="#9AA3B5" stroke-width="2"/>
  <g fill="#8DA2C9">
    <rect x="272" y="428" width="32" height="32" rx="8"/><rect x="316" y="428" width="32" height="32" rx="8"/>
    <rect x="360" y="428" width="32" height="32" rx="8"/><rect x="404" y="428" width="32" height="32" rx="8"/>
    <rect x="524" y="428" width="32" height="32" rx="8"/><rect x="568" y="428" width="32" height="32" rx="8"/>
    <rect x="612" y="428" width="32" height="32" rx="8"/><rect x="656" y="428" width="32" height="32" rx="8"/>
  </g>
  <line x1="250" y1="418" x2="710" y2="418" stroke="#16A34A" stroke-width="5" stroke-linecap="round"/>

  <!-- two fighters standing on the Dock -->
  <g>
    <rect x="410" y="360" width="26" height="54" rx="12" fill="#F28C28"/>
    <circle cx="423" cy="350" r="13" fill="#F28C28"/>
    <rect x="406" y="318" width="34" height="18" rx="5" fill="#D63A3A"/>
    <text x="423" y="331" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">P1</text>
    <rect x="528" y="360" width="26" height="54" rx="12" fill="#3D7BEA"/>
    <circle cx="541" cy="350" r="13" fill="#3D7BEA"/>
    <rect x="524" y="318" width="34" height="18" rx="5" fill="#3D7BEA"/>
    <text x="541" y="331" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">P2</text>
  </g>

  <!-- callouts -->
  <g font-size="15" fill="#2B2F3A">
    <line x1="760" y1="150" x2="852" y2="68" stroke="#2B2F3A" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="700" y="170">menu bar app: players,</text>
    <text x="700" y="189">controls, display, match</text>

    <line x1="480" y1="120" x2="480" y2="78" stroke="#2B2F3A" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="480" y="140" text-anchor="middle">stocks and percents in the</text>
    <text x="480" y="159" text-anchor="middle">black "island" around the notch</text>

    <line x1="760" y1="372" x2="712" y2="416" stroke="#16A34A" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="736" y="352" fill="#14803D" font-weight="bold">the Dock's top edge</text>
    <text x="736" y="371" fill="#14803D" font-weight="bold">is the stage floor</text>

    <line x1="138" y1="392" x2="58" y2="430" stroke="#D63A3A" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="96" y="372" fill="#B42323" font-weight="bold">screen edges are</text>
    <text x="96" y="391" fill="#B42323" font-weight="bold">the blastzones</text>
  </g>

  <text x="480" y="516" font-size="17" fill="#2B2F3A" text-anchor="middle" font-weight="bold">One transparent window covers the whole screen. Only the fighters, effects and HUD are drawn.</text>
  <text x="480" y="540" font-size="14" fill="#6B7385" text-anchor="middle">Everything else in that window is see-through, so the desktop and your apps show underneath.</text>
</svg>
